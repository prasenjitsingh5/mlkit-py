[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiml"
version = "0.1.0"
description = "A small, modular toolkit for data preprocessing, machine learning and deep learning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prasenjit Singh" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
deep = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["aiml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
